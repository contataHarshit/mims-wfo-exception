<div class="confirm-popup">
  <h2>{{data.title }}</h2>
  <p>{{ data.message }}</p>

  <div class="button-group">
    <button pButton [label]="data.confirmLabel" class="p-button-danger" (click)="onConfirm()"></button>
    <button pButton label="No" class="p-button-secondary" (click)="onCancel()" *ngIf="data.showCancelButton"></button>
  </div>
</div>
