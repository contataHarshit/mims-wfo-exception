<div class="confirm-popup">
  <h2>{{data.title }}</h2>
  <p>{{ data.message }}</p>

  <div class="button-group">
    <button
      pButton
      label="Yes"
      class="p-button-danger"
      (click)="onConfirm()"
    ></button>
    <button
      pButton
      label="No"
      class="p-button-secondary"
      (click)="onCancel()"
    ></button>
  </div>
</div>
