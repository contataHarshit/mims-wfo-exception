<div class="form-actions">
  <button pButton type="button" class="p-button-secondary" icon="pi pi-refresh" (click)="onReset()"
    *ngIf="resetBtn !== false">
    Reset
  </button>

  <button pButton type="button" class="p-button-success" icon="pi pi-check" (click)="onSubmit()"
    *ngIf="showSubmit !== false">
    Submit
  </button>
</div>
