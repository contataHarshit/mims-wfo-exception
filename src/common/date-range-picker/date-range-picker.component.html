<p-calendar #calendar [(ngModel)]="tempSelection" [selectionMode]="selectionMode"
  [disabledDates]="internalDisabledDates" [minDate]="minDate" [maxDate]="maxDate" [showIcon]="true" [appendTo]="'body'"
  [disabled]="disabled" [disabledDays]="disabledDays" [hideOnDateTimeSelect]="selectionMode !== 'range'"
  panelStyleClass="custom-calendar-panel" (onShow)="onCalendarShow()" (onClose)="onCalendarHide()"
  (onMonthChange)="onMonthOrYearChange($event)" (onYearChange)="onMonthOrYearChange($event)"
  styleClass="hidden-calendar" placeholder="Select Dates" inputId="datePickerInput" dateFormat="dd M yy"
  [readonlyInput]="true">
  <!-- Footer template -->
  <ng-template pTemplate="footer">
    <div class="popup-buttons">
      <button type="button" pButton label="OK" icon="pi pi-check" class="p-button-sm p-button-raised ok-btn"
        (click)="confirmSelection()"></button>
      <button type="button" pButton label="Cancel" icon="pi pi-times" class="p-button-sm p-button-raised cancel-btn"
        (click)="cancelSelection()"></button>
    </div>
  </ng-template>
</p-calendar>
<div class="outer-box">
</div>
