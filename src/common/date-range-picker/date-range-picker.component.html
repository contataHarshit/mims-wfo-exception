<p-calendar
  [(ngModel)]="selectedDates"
  [selectionMode]="'multiple'"
  (onSelect)="onDateSelect($event)"
  [disabledDates]="allDisabledDates"
  [showButtonBar]="true"
  appendTo="body"
  placeholder="Select multiple dates"
  [showIcon]="true"
  (onClearClick)="onClear()"
  [dateFormat]="'yy-mm-dd'"
  [readonlyInput]="true"
>
</p-calendar>
