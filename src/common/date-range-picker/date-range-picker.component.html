<p-calendar [(ngModel)]="range" (ngModelChange)="onModelChange($event)" selectionMode="range" dateFormat="yy-mm-dd"
  showIcon="true" appendTo="body" [minDate]="minDate" [maxDate]="maxDate" [disabledDates]="allDisabledDates"
  [disabledDays]="disabledDays" (onClearClick)="onClear()" [showButtonBar]="true"></p-calendar>
