<div class="page-container">
  <h2 class="page-title">WFO Exception Request</h2>

  <p-card>
    <div class="form-grid">
      <div class="form-row">
        <label>Employee ID</label>
        <input pInputText [(ngModel)]="formData.employeeId" readonly />
      </div>

      <div class="form-row">
        <label>Employee Name</label>
        <input pInputText [(ngModel)]="formData.employeeName" readonly />
      </div>

      <div class="form-row">
        <label>Project Name *</label>
        <p-dropdown
          [options]="projectList"
          [(ngModel)]="formData.projectName"
          placeholder="Select Project"
        ></p-dropdown>
      </div>

      <div class="form-row">
        <label>Project Manager</label>
        <input pInputText [(ngModel)]="formData.projectManager" readonly />
      </div>
    </div>
  </p-card>

  <p-card class="table-section">
    <h3>Exception Details</h3>

    <p-table
      [value]="formData.exceptions"
      dataKey="index"
      class="p-datatable-gridlines"
      [tableStyle]="{ 'min-width': '100%' }"
    >
      <ng-template pTemplate="header">
        <tr>
          <th>#</th>
          <th>From *</th>
          <th>To *</th>
          <th>Days</th>
          <th>Primary Reason *</th>
          <th>Remarks</th>
          <th>Action</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-e let-i="rowIndex">
        <tr>
          <td>{{ i + 1 }}</td>

          <td>
            <p-calendar [(ngModel)]="e.fromDate" dateFormat="yy-mm-dd" showIcon appendTo="body"></p-calendar>
          </td>

          <td>
            <p-calendar [(ngModel)]="e.toDate" dateFormat="yy-mm-dd" showIcon appendTo="body"></p-calendar>
          </td>

          <td>{{ calculateDays(e.fromDate, e.toDate) }}</td>

          <td>
            <p-dropdown
              [options]="reasonList"
              [(ngModel)]="e.primaryReason"
              placeholder="Select"
            ></p-dropdown>
          </td>

          <td>
            <textarea pInputTextarea [(ngModel)]="e.remarks" rows="1"></textarea>
          </td>

          <td>
            <button
              pButton
              icon="pi pi-trash"
              class="p-button-rounded p-button-danger p-button-sm"
              (click)="deleteIndex(i)"
              *ngIf="formData.exceptions.length > 1"
            ></button>
            <button
              pButton
              icon="pi pi-plus"
              class="p-button-rounded p-button-success p-button-sm"
              (click)="addMore()"
              *ngIf="i === formData.exceptions.length - 1"
            ></button>
          </td>
        </tr>
      </ng-template>
    </p-table>

    <div class="form-actions">
      <button pButton label="Reset" class="p-button-danger" (click)="resetForm()"></button>
      <button pButton label="Submit" class="p-button-success" (click)="onSubmit()"></button>
    </div>
  </p-card>
</div>
