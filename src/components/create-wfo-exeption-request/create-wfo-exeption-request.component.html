<div class="page-container">
  <p-card class="main-form-card">
    <!-- EMPLOYEE DETAILS SECTION -->
    <div class="form-grid">
      <div class="form-row">
        <label>Employee ID</label>
        <input pInputText [(ngModel)]="formData.employeeId" readonly />
      </div>

      <div class="form-row">
        <label>Employee Name</label>
        <input pInputText [(ngModel)]="formData.employeeName" readonly />
      </div>

      <div class="form-row">
        <label>Project Name *</label>
        <div pTooltip="{{ getProjectNamesTooltip() }}" tooltipPosition="top" [escape]="false" style="width: 100%">
          <p-multiSelect [options]="projectList" [(ngModel)]="formData.projectName" optionLabel="label"
            optionValue="value" placeholder="Select Project(s)" display="chip" styleClass="w-full"
            [disabled]="true"></p-multiSelect>
        </div>
      </div>


      <div class="form-row">
        <label>Project Manager</label>
        <input pInputText [(ngModel)]="formData.projectManager" readonly />
      </div>
    </div>

    <!-- EXCEPTION DETAILS TABLE -->
    <div class="exception-section">
      <h4 class="section-title">Exception Details</h4>

      <p-table [value]="formData.exceptions" dataKey="index" class="p-datatable-gridlines"
        [tableStyle]="{ 'min-width': '100%' }">
        <ng-template pTemplate="header">
          <tr>
            <th>#</th>
            <th>Date Range *</th>
            <th>Days</th>
            <th>Primary Reason *</th>
            <th>Remarks</th>
            <th>Action</th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-e let-i="rowIndex">
          <tr>
            <td>{{ i + 1 }}</td>
            <td>
              <app-date-range-picker [(range)]="e.dateRange" [restrictionKey]="'restrictMonthSelection'"
                [disabledDates]="disabledDates" (rangeChange)="onDateRangeSelect($event, i)">
              </app-date-range-picker>

            </td>

            <td>
              <input type="text" pInputText [(ngModel)]="e.exceptionRequestedDays" placeholder="Enter Days"
                (input)="enforceMinMaxDays(e, $event)" />
              <br>
              <span> <i>{{userRole=="MANAGER"?"Max exception 3 days per week":"Max exception 2 days per
                  week"}}</i></span>
            </td>


            <td>
              <div *ngIf="!e.showOtherReason" class="stable-width">
                <app-common-select [options]="reasonList" [(value)]="e.primaryReason" placeholder="Select"
                  [searchKey]="'label'" (valueChange)="onPrimaryReasonChange(e)">
                </app-common-select>
              </div>

              <div *ngIf="e.showOtherReason" class="stable-width input-wrapper">
                <input pInputText [(ngModel)]="e.otherReason" placeholder="Enter other reason"
                  class="input-with-icons" />
                <i class="pi pi-check inside-icon tick" (click)="confirmOtherReason(e)"></i>
                <i class="pi pi-times inside-icon cross" (click)="cancelOtherReason(e)"></i>
              </div>
            </td>

            <td>
              <textarea pInputTextarea [(ngModel)]="e.remarks" rows="1" placeholder="Enter Remarks"></textarea>
            </td>

            <td>
              <button pButton icon="pi pi-trash" class="p-button-rounded p-button-danger p-button-sm"
                (click)="deleteIndex(i)" *ngIf="formData.exceptions.length > 1">
              </button>
              <button pButton icon="pi pi-plus" class="p-button-rounded p-button-success p-button-sm"
                (click)="addMore()" *ngIf="i === formData.exceptions.length - 1">
              </button>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>

    <!-- FORM ACTIONS -->
    <div class="form-actions">
      <button pButton label="Reset" class="p-button-danger" (click)="resetForm()"></button>
      <button pButton label="Submit" class="p-button-success" (click)="onSubmit()"></button>
    </div>
  </p-card>
</div>
