<div class="page-container">
  <div class="page-header">
    <h1>WFO Exception Request</h1>
  </div>

  <div class="filter-section">
    <form (ngSubmit)="onSubmit()">
      <!-- Employee Row -->
      <div class="row">
        <div class="field">
          <label>Employee ID</label>
          <input name="employeeId" [(ngModel)]="formData.employeeId" readonly />
        </div>

        <div class="field">
          <label>Employee Name</label>
          <input name="employeeName" [(ngModel)]="formData.employeeName" readonly />
        </div>
      </div>

      <!-- Exception Blocks -->
      <div *ngFor="let exception of formData.exceptions; let i = index" class="exception-block">
        <p class="exception-index">#{{ i + 1 }}</p>

        <div class="row">
          <div class="field">
            <label>Project Name *</label>
            <select name="projectName" [(ngModel)]="formData.projectName" required>
              <option value="">Select Project</option>
              <option value="Project A">Project A</option>
              <option value="Project B">Project B</option>
            </select>
          </div>

          <div class="field">
            <label>Project Manager</label>
            <input name="projectManager" [(ngModel)]="formData.projectManager" readonly />
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label>Exception From *</label>
            <input type="date" name="fromDate{{i}}" [(ngModel)]="exception.fromDate" required />
          </div>

          <div class="field">
            <label>To *</label>
            <input type="date" name="toDate{{i}}" [(ngModel)]="exception.toDate" required />
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label>Days Requested</label>
            <input
              type="text"
              name="daysRequested{{i}}"
              [value]="calculateDays(exception.fromDate, exception.toDate)"
              readonly
            />
          </div>

          <div class="field">
            <label>Primary Reason *</label>
            <select name="primaryReason{{i}}" [(ngModel)]="exception.primaryReason" required>
              <option value="">Select Primary Reason</option>
              <option value="Health Issue">Health Issue</option>
              <option value="Personal Work">Personal Work</option>
              <option value="Travel">Travel</option>
            </select>
          </div>
        </div>

        <div class="row">
          <div class="field full">
            <label>Remarks</label>
            <textarea name="remarks{{i}}" [(ngModel)]="exception.remarks"></textarea>
          </div>
        </div>

        <div class="row actions-inline">
          <button type="button" class="add-more" (click)="addMore()" *ngIf="i === formData.exceptions.length - 1">
            + Add More
          </button>

          <button
            type="button"
            class="delete"
            (click)="deleteIndex(i)"
            *ngIf="formData.exceptions.length > 1 && i !== 0"
          >
            <i class="fa fa-trash"></i> Delete
          </button>
        </div>

        <hr />
      </div>

      <!-- Footer Buttons -->
      <div class="form-actions">
        <button type="button" class="btn btn-reset" (click)="resetForm()">Reset</button>
        <button type="submit" class="btn btn-submit">Submit</button>
      </div>
    </form>
  </div>
</div>
