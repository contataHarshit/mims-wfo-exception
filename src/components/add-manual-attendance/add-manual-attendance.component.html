<div class="dashboard-page manual-attendance-page">

  <!-- FILTER CARD -->
  <div class="dashboard-filter">
    <div class="filter">

      <div class="form-row">
        <label>Date</label>
        <input type="date" [(ngModel)]="selectedDate" class="date-input" [max]="maxDate" />
      </div>



      <div class="form-row" style="align-items: flex-end;">
        <app-common-mail-submit [showSubmit]="true" [showReset]="false" (sendWeekly)="commonService.sendWeeklyMail()"
          (sendMonthly)="commonService.sendMonthlyMail()" (submit)="submit()" (reset)="reset()"
          [submitLabel]="'Save'"></app-common-mail-submit>
      </div>

    </div>
  </div>

  <!-- CONTENT -->
  <div class="manual-attendance-content">

    <!-- ALL EMPLOYEES -->
    <div class="dashboard-table-card">

      <!-- HEADER (WFH STYLE) -->
      <div class="card-header">
        <span>All Employees</span>
        <span class="count">{{ filteredEmployees.length }}</span>
      </div>

      <!-- SEARCH -->
      <input type="text" placeholder="Search employee..." class="list-search" [(ngModel)]="employeeSearch" />

      <!-- LIST -->
      <div class="employee-table">
        <div class="employee-row" *ngFor="let emp of filteredEmployees">
          <input type="checkbox" [(ngModel)]="emp.checked" />
          <div class="emp-name">{{ emp.FullName || emp.employeeName }}</div>
          <div class="emp-email">{{ emp.email || emp.Email }}</div>
        </div>
      </div>

    </div>

    <!-- MOVE -->
    <!-- MOVE COLUMN -->
    <div class="move-column">

      <!-- ATTENDANCE TYPE DROPDOWN -->
      <select class="attendance-type-select" [(ngModel)]="attendanceType">
        <option value="FD">Full Day (FD)</option>
        <option value="SF">Second Half (SF)</option>
        <option value="FH">Half Day (FH)</option>
      </select>

      <button pButton label="Move" icon="pi pi-arrow-right" class="p-button-outlined" (click)="moveSelected()"></button>

    </div>


    <!-- SELECTED EMPLOYEES -->
    <div class="dashboard-table-card">

      <div class="card-header">
        <span>Selected Employees</span>
        <span class="count">{{ selectedEmployees.length }}</span>
      </div>

      <div class="employee-table empty" *ngIf="!selectedEmployees.length">
        No employees selected
      </div>

      <div class="employee-table" *ngIf="selectedEmployees.length">
        <div class="employee-row" *ngFor="let emp of selectedEmployees">
          <div class="emp-name">{{ emp.FullName || emp.employeeName }}</div>
          <div class="emp-email">{{ emp.email || emp.Email }}</div>

          <button pButton icon="pi pi-times" class="p-button-text p-button-danger p-button-sm"
            (click)="removeEmployee(emp)"></button>
        </div>
      </div>

    </div>

  </div>
</div>
