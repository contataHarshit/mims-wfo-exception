<h2 class="header-bar">
  <img src="../../assets/contata-logo.png" alt="" id="logImg" />
  <span class="header-title">{{header}}</span>
  <select *ngIf="dashboardModeReady" id="dashboard-mode" [value]="dashboardMode" (change)="onViewChange($event)"
    class="dashboard-mode-select" aria-label="Select workflow">
    <option value="wfh">WFH Dashboard</option>
    <option value="od">OD Dashboard</option>
  </select>
  <button (click)="close()" class="logout-btn">Close</button>
</h2>
